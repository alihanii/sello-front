# build: on every pull request and push to main, build the frontend image (a failed build stops here).
# deploy: on push to main only, copy the built image to the server over SSH and restart the frontend.
# The stack (docker-compose.yml, nginx site, .env) is set up on the server by sello-back's deploy workflow.
#
# Repository secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, optional SSH_PORT (default 22).
# Repository variables: NEXT_PUBLIC_API_URL (the site address, e.g. https://sello.example.com),
#                       optional DEPLOY_PATH (default /opt/sello),
#                       optional NEXT_PUBLIC_CLARITY_ID (Microsoft Clarity project ID; empty turns it off).
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-{0}', github.ref) || 'deploy-server' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sello' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: test -n "$API_URL" || { echo "::error::Set the NEXT_PUBLIC_API_URL repository variable"; exit 1; }

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_CLARITY_ID="${{ vars.NEXT_PUBLIC_CLARITY_ID }}" \
            -t sello-front:latest .

      - name: Save image
        if: github.event_name != 'pull_request'
        run: docker save sello-front:latest | gzip -1 > sello-front.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sello-front-image
          path: sello-front.tar.gz
          retention-days: 3
          compression-level: 0

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sello-front-image

      - name: SSH setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config

      - name: Copy image and restart
        run: |
          ssh server "test -f '$DEPLOY_PATH/docker-compose.yml'" || { echo "::error::Deploy sello-back first: it sets up $DEPLOY_PATH"; exit 1; }
          scp sello-front.tar.gz "server:$DEPLOY_PATH/"
          ssh server "set -e; cd '$DEPLOY_PATH'
            gunzip -c sello-front.tar.gz | docker load && rm sello-front.tar.gz
            docker compose up -d --remove-orphans
            docker image prune -f >/dev/null
            docker compose ps"
