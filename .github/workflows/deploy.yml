# Every push to main: build the frontend image here, copy it to the server over SSH and restart it.
# The stack (docker-compose.yml, Caddyfile, .env) is set up on the server by sello-back's deploy workflow.
#
# Repository secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, optional SSH_PORT (default 22).
# Repository variables: NEXT_PUBLIC_API_URL (the site address, e.g. https://sello.example.com),
#                       optional DEPLOY_PATH (default /opt/sello).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sello' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: test -n "$API_URL" || { echo "::error::Set the NEXT_PUBLIC_API_URL repository variable"; exit 1; }

      - name: Build image
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" -t sello-front:latest .
          docker save sello-front:latest | gzip -1 > sello-front.tar.gz

      - name: SSH setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config

      - name: Copy image and restart
        run: |
          ssh server "test -f '$DEPLOY_PATH/docker-compose.yml'" || { echo "::error::Deploy sello-back first: it sets up $DEPLOY_PATH"; exit 1; }
          scp sello-front.tar.gz "server:$DEPLOY_PATH/"
          ssh server "set -e; cd '$DEPLOY_PATH'
            gunzip -c sello-front.tar.gz | docker load && rm sello-front.tar.gz
            docker compose up -d --remove-orphans
            docker image prune -f >/dev/null
            docker compose ps"
